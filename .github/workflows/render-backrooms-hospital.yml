name: Render Original 3D Backrooms (30s POV)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/render-backrooms-hospital.yml"
      - "scripts/backrooms_3d.py"
      - "scripts/hospital_audio.py"
  workflow_dispatch:
    inputs:
      quality:
        description: "Cycles CPU render profile"
        type: choice
        required: true
        default: standard
        options:
          - draft
          - standard
          - high

permissions:
  contents: read

concurrency:
  group: original-backrooms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Original 3D scene / Cycles CPU / single POV camera / 30s
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout ORIGINAL Blender source (no stock footage)
        uses: actions/checkout@v4

      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender ffmpeg
          blender --version | head -n 2
          ffmpeg -version | head -n 1

      - name: Select physically rendered Cycles quality
        env:
          QUALITY: ${{ inputs.quality || 'standard' }}
        run: |
          if [ "$QUALITY" = "high" ]; then
            echo "WIDTH=1280" >> "$GITHUB_ENV"
            echo "HEIGHT=720" >> "$GITHUB_ENV"
            echo "FPS=24" >> "$GITHUB_ENV"
            echo "FRAMES=720" >> "$GITHUB_ENV"
            echo "SAMPLES=12" >> "$GITHUB_ENV"
          elif [ "$QUALITY" = "draft" ]; then
            echo "WIDTH=640" >> "$GITHUB_ENV"
            echo "HEIGHT=360" >> "$GITHUB_ENV"
            echo "FPS=15" >> "$GITHUB_ENV"
            echo "FRAMES=450" >> "$GITHUB_ENV"
            echo "SAMPLES=4" >> "$GITHUB_ENV"
          else
            echo "WIDTH=960" >> "$GITHUB_ENV"
            echo "HEIGHT=540" >> "$GITHUB_ENV"
            echo "FPS=18" >> "$GITHUB_ENV"
            echo "FRAMES=540" >> "$GITHUB_ENV"
            echo "SAMPLES=7" >> "$GITHUB_ENV"
          fi

      - name: Smoke-test actual Blender 3D scene and render a real frame
        run: |
          blender --background --factory-startup --threads 4 \
            --python scripts/backrooms_3d.py -- \
            --output-dir output/backrooms --width 640 --height 360 \
            --fps "$FPS" --frames "$FRAMES" --samples 12 \
            --render-still --still-frame "$((FRAMES / 2))"
          test -s output/backrooms/preview.png
          test -s output/backrooms/backrooms_hospital_3d.blend

      - name: Upload proof of actual Cycles render
        uses: actions/upload-artifact@v4
        with:
          name: backrooms-real-blender-preview
          path: output/backrooms/preview.png
          retention-days: 14

      - name: Render EVERY animation frame in Blender Cycles CPU
        run: |
          blender --background --factory-startup --threads 4 \
            --python scripts/backrooms_3d.py -- \
            --output-dir output/backrooms --width "$WIDTH" --height "$HEIGHT" \
            --fps "$FPS" --frames "$FRAMES" --samples "$SAMPLES"
          test -s output/backrooms/frames/frame_0001.png
          test -s "output/backrooms/frames/frame_$(printf '%04d' "$FRAMES").png"

      - name: Generate original ambient audio (not stock video)
        run: |
          python3 scripts/hospital_audio.py \
            --output output/backrooms/ambience.wav --seconds 30

      - name: Encode 30-second POV video and atmosphere
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -framerate "$FPS" -start_number 1 \
            -i output/backrooms/frames/frame_%04d.png \
            -i output/backrooms/ambience.wav \
            -vf "hqdn3d=1.8:1.3:2:1.6,format=yuv420p" \
            -map 0:v:0 -map 1:a:0 \
            -c:v libx264 -preset medium -crf 19 -pix_fmt yuv420p \
            -c:a aac -b:a 160k -t 30 -movflags +faststart \
            output/backrooms/backrooms_hospital_3d_30s.mp4

      - name: Assert exactly thirty seconds, original 3D scene, valid codecs
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          path="output/backrooms/backrooms_hospital_3d_30s.mp4"
          result=subprocess.run([
            "ffprobe","-v","error","-show_entries","format=duration,size",
            "-show_entries","stream=codec_name,width,height",
            "-of","json",path
          ],check=True,capture_output=True,text=True)
          data=json.loads(result.stdout)
          duration=float(data["format"]["duration"])
          assert abs(duration-30.0)<0.12, duration
          assert int(data["format"]["size"])>500000
          assert any(s["codec_name"]=="h264" for s in data["streams"])
          assert any(s["codec_name"]=="aac" for s in data["streams"])
          assert os.path.getsize("output/backrooms/backrooms_hospital_3d.blend")>10000
          print("VERIFIED: 30-second video rendered directly from original Blender 3D meshes; no stock footage",duration)
          PY

      - name: Upload rendered movie, preview, source project and audio
        uses: actions/upload-artifact@v4
        with:
          name: backrooms-original-3d-30s
          path: |
            output/backrooms/backrooms_hospital_3d_30s.mp4
            output/backrooms/backrooms_hospital_3d.blend
            output/backrooms/preview.png
            output/backrooms/ambience.wav
          if-no-files-found: error
          retention-days: 14
