name: Render Backrooms Hospital POV (30s)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/render-backrooms-hospital.yml"
      - "scripts/prepare_hospital.py"
      - "scripts/backrooms_hospital.py"
      - "scripts/hospital_audio.py"
      - "hospital_sources.json"
  workflow_dispatch:
    inputs:
      quality:
        description: "Final video quality"
        required: true
        type: choice
        default: "1080p"
        options: ["1080p", "720p"]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    name: 30 seconds / Real filmed POV / Blender CLI
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install headless Blender, FFmpeg and curl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender ffmpeg curl
          blender --version | head -n 2
          ffmpeg -version | head -n 1

      - name: Set resolution
        env:
          QUALITY: ${{ inputs.quality || '1080p' }}
        run: |
          if [ "$QUALITY" = "720p" ]; then
            echo "WIDTH=1280" >> "$GITHUB_ENV"
            echo "HEIGHT=720" >> "$GITHUB_ENV"
          else
            echo "WIDTH=1920" >> "$GITHUB_ENV"
            echo "HEIGHT=1080" >> "$GITHUB_ENV"
          fi

      - name: Download authentic location footage, grade and prepare POV takes
        run: |
          python3 scripts/prepare_hospital.py \
            --spec hospital_sources.json --output-dir output/backrooms \
            --width "$WIDTH" --height "$HEIGHT"

      - name: Build authentic ambient audio and slow footsteps
        run: |
          python3 scripts/hospital_audio.py \
            --seconds 30 --output output/backrooms/ambience.wav

      - name: Blender CLI headless edit / actual video render
        run: |
          blender --background --factory-startup --threads 4 \
            --python scripts/backrooms_hospital.py -- \
            --manifest output/backrooms/sources_used.json \
            --audio output/backrooms/ambience.wav \
            --output-dir output/backrooms
          test -s output/backrooms/backrooms_silent.mp4

      - name: Mux original atmosphere and validate exact 30s MP4
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -i output/backrooms/backrooms_silent.mp4 \
            -i output/backrooms/ambience.wav \
            -map 0:v:0 -map 1:a:0 \
            -c:v copy -c:a aac -b:a 160k -t 30 \
            -movflags +faststart output/backrooms/backrooms_hospital_30s.mp4
          python3 - <<'PY'
          import json, subprocess
          p=subprocess.run([
             "ffprobe","-v","error",
             "-show_entries","format=duration",
             "-show_entries","stream=codec_name,width,height",
             "-of","json","output/backrooms/backrooms_hospital_30s.mp4"
          ],check=True,text=True,capture_output=True)
          data=json.loads(p.stdout)
          seconds=float(data["format"]["duration"])
          assert abs(seconds-30)<.12, "Expected exactly 30 s, got "+str(seconds)
          assert any(s["codec_name"]=="h264" for s in data["streams"])
          assert any(s["codec_name"]=="aac" for s in data["streams"])
          print("SUCCESS: 30-second H264+AAC real-footage POV",seconds)
          PY
          ffmpeg -hide_banner -loglevel error -y -ss 12 \
            -i output/backrooms/backrooms_hospital_30s.mp4 \
            -frames:v 1 output/backrooms/preview.jpg
          test -s output/backrooms/preview.jpg

      - name: Upload film, source credits, and portable editable Blender project
        uses: actions/upload-artifact@v4
        with:
          name: backrooms-hospital-pov-30s
          path: |
            output/backrooms/backrooms_hospital_30s.mp4
            output/backrooms/preview.jpg
            output/backrooms/backrooms_hospital_edit.blend
            output/backrooms/ambience.wav
            output/backrooms/sources_used.json
            output/backrooms/input/shot_*.mp4
          if-no-files-found: error
          retention-days: 14
