name: Render Real Summer Film

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/render-summer.yml"
      - "scripts/real_summer.py"
      - "scripts/get_footage.py"
      - "sources.json"
  workflow_dispatch:
    inputs:
      quality:
        description: "Video resolution"
        required: true
        type: choice
        default: "1080p"
        options:
          - "1080p"
          - "720p"

permissions:
  contents: read

jobs:
  edit-and-render:
    name: Blender CLI / cinematic real beach footage / MP4
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender ffmpeg curl
          blender --version | head -n 2
          ffmpeg -version | head -n 1

      - name: Pick render resolution
        env:
          QUALITY: ${{ inputs.quality || '1080p' }}
        run: |
          if [ "$QUALITY" = "720p" ]; then
            echo "WIDTH=1280" >> "$GITHUB_ENV"
            echo "HEIGHT=720" >> "$GITHUB_ENV"
          else
            echo "WIDTH=1920" >> "$GITHUB_ENV"
            echo "HEIGHT=1080" >> "$GITHUB_ENV"
          fi

      - name: Download legal filmed summer scenes and preprocess shots
        run: |
          python3 scripts/get_footage.py \
            --source-list sources.json --output-dir output/source \
            --width "$WIDTH" --height "$HEIGHT" --fps 25 \
            --seconds 4 --max-clips 3

      - name: Blender CLI video-sequencer render
        run: |
          blender --background --factory-startup --threads 4 \
            --python scripts/real_summer.py -- \
            --shots-dir output/source --output output/summer_real.mp4 \
            --width "$WIDTH" --height "$HEIGHT" --fps 25 \
            --shot-seconds 4 --fade-frames 10
          test -s output/summer_real.mp4

      - name: Validate the film and capture a real frame
        run: |
          ffprobe -v error -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 output/summer_real.mp4
          ffmpeg -hide_banner -loglevel error -y -ss 4 \
            -i output/summer_real.mp4 -frames:v 1 output/preview.jpg
          test -s output/preview.jpg
          cp output/source/used_sources.json output/credits.json

      - name: Upload final MP4 and editable Blender VSE project
        uses: actions/upload-artifact@v4
        with:
          name: real-summer-1080p-video
          path: |
            output/summer_real.mp4
            output/preview.jpg
            output/summer_real_edit.blend
            output/credits.json
          if-no-files-found: error
          retention-days: 14
